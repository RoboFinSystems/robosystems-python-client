name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run Tests
        run: |
          uv run pytest tests/ -v

      - name: Run Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        run: |
          uv run basedpyright

      - name: GraphQL codegen drift gate
        run: |
          # Regenerate typed models from the checked-in schema + operations
          # and fail if the result differs from what's committed. Keeps
          # generated/ honest against schema.graphql and operations/*.graphql.
          bin/generate-graphql.sh
          if [ -n "$(git status --porcelain robosystems_client/graphql/generated/)" ]; then
            git status --porcelain robosystems_client/graphql/generated/
            git diff robosystems_client/graphql/generated/ | head -100
            echo "::error::Generated GraphQL models are stale — run 'just generate-graphql' and commit the result."
            exit 1
          fi

  # The stable tier of the 1.0+ contract is defined by what the integration
  # template imports, so the template is what decides minor vs major: build it
  # against this working tree and let its own typecheck and tests answer.
  # Green means the stable tier is intact and the change can ride a minor.
  # Red means either the change is a major, or it is wrong.
  template-compat:
    name: Template compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout client
        uses: actions/checkout@v7
        with:
          path: client

      - name: Checkout integration template
        uses: actions/checkout@v7
        with:
          repository: RoboFinSystems/robosystems-integration-template
          path: template

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install the template against this client
        working-directory: template
        run: |
          # Sync the template's own lock first, then overwrite the published
          # robosystems-client with the candidate from this branch.
          uv sync --all-extras
          uv pip install ../client

      - name: Verify the stable surface still resolves
        working-directory: template
        run: |
          # --no-sync so uv does not restore the locked client over the
          # candidate we just installed.
          uv run --no-sync basedpyright
          uv run --no-sync pytest tests/ -q
