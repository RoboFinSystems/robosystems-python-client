  """Unit basis (`shares`, `units`, `principal`)."""
  quantityType: String!

  """Cost basis in dollars (pre-converted from cents)."""
  costBasisDollars: Float!

  """
  Latest mark-to-market value in dollars. `null` when the position has not been marked.
