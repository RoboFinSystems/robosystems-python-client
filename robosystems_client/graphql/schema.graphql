  version: String
  namespaceUri: String

  """chart_of_accounts | reporting | mapping | schedule"""
  taxonomyType: String!
  isShared: Boolean!
  isActive: Boolean!
  isLocked: Boolean!

  """Total elements in this taxonomy (computed on demand)"""
