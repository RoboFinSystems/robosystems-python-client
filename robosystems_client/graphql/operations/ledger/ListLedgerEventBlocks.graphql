query ListLedgerEventBlocks(
  $eventType: String
  $eventCategory: String
  $status: String
  $agentId: String
  $source: String
  $isReconcilingItem: Boolean
  $limit: Int! = 50
  $offset: Int! = 0
  $entityId: String
) {
  eventBlocks(
    eventType: $eventType
    eventCategory: $eventCategory
    status: $status
    agentId: $agentId
    source: $source
    isReconcilingItem: $isReconcilingItem
    limit: $limit
    offset: $offset
    entityId: $entityId
  ) {
    id eventType eventCategory eventClass status occurredAt effectiveAt
    source externalId externalUrl amount currency description metadata
    dimensionIds agentId resourceType resourceElementId
    replacedByEventId replacesEventId obligatedByEventId dischargesEventId documentId
    createdAt createdBy
  }
}
