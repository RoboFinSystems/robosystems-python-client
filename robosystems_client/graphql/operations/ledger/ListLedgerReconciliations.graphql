query ListLedgerReconciliations($period: String!, $entityId: String) {
  reconciliations(period: $period, entityId: $entityId) {
    period asOf notes
    reconciliations {
      structureId name scope method elementId
      requiredForClose materiality statementCycle
      period asOf status unreconciledDifference
      accountsCompared accountsDifferent
      ledgerBalance independentBalance balanceAsOf
      components {
        name amount kind postingDate entryId structureId eventId documentId note
      }
      rollForward {
        statementAsOf through bankLines bankActivity bankBalance
        ledgerBalance outstanding feedBalance feedBalanceReadOn
      }
      source comparedAt factSetId comparedBy comparedVia
      reviewRequired separateReviewer reviewedBy reviewedAt selfReviewed
      differences {
        elementId accountCode accountName sourceAccountId statement
        ledgerBalance independentBalance difference status asOf
        components {
          name amount kind postingDate entryId structureId eventId documentId note
        }
        rollForward {
          statementAsOf through bankLines bankActivity bankBalance
          ledgerBalance outstanding feedBalance feedBalanceReadOn
        }
      }
    }
  }
}
