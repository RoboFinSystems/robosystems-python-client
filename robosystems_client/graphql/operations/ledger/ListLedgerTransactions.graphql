query ListLedgerTransactions(
  $type: String
  $startDate: Date
  $endDate: Date
  $limit: Int! = 100
  $offset: Int! = 0
  $entityId: String
) {
  transactions(
    type: $type
    startDate: $startDate
    endDate: $endDate
    limit: $limit
    offset: $offset
    entityId: $entityId
  ) {
    transactions {
      id number type category amount currency date dueDate
      merchantName referenceNumber description source status
    }
    pagination { total limit offset hasMore }
  }
}
