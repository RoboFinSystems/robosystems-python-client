query GetLedgerEventBlock($id: String!) {
  eventBlock(id: $id) {
    id eventType eventCategory eventClass status occurredAt effectiveAt
    source externalId externalUrl amount currency description metadata
    dimensionIds agentId resourceType resourceElementId
    replacedByEventId replacesEventId obligatedByEventId dischargesEventId documentId
    createdAt createdBy
    triggeredEntries {
      id number type status postingDate memo provenance totalDebit totalCredit
      lineItems {
        id accountId accountName accountCode
        debitAmount creditAmount description lineOrder
      }
    }
  }
}
