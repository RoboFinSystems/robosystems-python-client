query GetLedgerTrialBalance($startDate: Date, $endDate: Date, $entityId: String) {
  trialBalance(startDate: $startDate, endDate: $endDate, entityId: $entityId) {
    totalDebits
    totalCredits
    rows {
      accountId
      accountCode
      accountName
      trait
      accountType
      totalDebits
      totalCredits
      netBalance
    }
  }
}
