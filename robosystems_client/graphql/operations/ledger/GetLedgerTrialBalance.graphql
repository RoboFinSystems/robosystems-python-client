query GetLedgerTrialBalance(
  $startDate: Date
  $endDate: Date
  $entityId: String
  $dimensionType: String
  $dimensionMemberId: String
) {
  trialBalance(
    startDate: $startDate
    endDate: $endDate
    entityId: $entityId
    dimensionType: $dimensionType
    dimensionMemberId: $dimensionMemberId
  ) {
    totalDebits
    totalCredits
    sliced
    rows {
      accountId
      accountCode
      accountName
      trait
      accountType
      totalDebits
      totalCredits
      netBalance
    }
  }
}
