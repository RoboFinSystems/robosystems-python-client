query ListLedgerEntities($source: String) {
  entities(source: $source) {
    id
    name
    legalName
    ticker
    cik
    industry
    entityType
    status
    isParent
    parentEntityId
    ownershipPct
    consolidationMethod
    entityRole
    joinedOn
    leftOn
    source
    sourceGraphId
    connectionId
    createdAt
    updatedAt
  }
}
