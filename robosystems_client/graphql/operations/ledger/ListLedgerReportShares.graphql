query ListLedgerReportShares(
  $reportId: String
  $includeRevoked: Boolean! = false
  $limit: Int! = 100
  $offset: Int! = 0
) {
  reportShares(
    reportId: $reportId
    includeRevoked: $includeRevoked
    limit: $limit
    offset: $offset
  ) {
    reportShares {
      id reportId targetGraphId targetGraphName
      sharedBy sharedAt revokedAt factCount
    }
    pagination { total limit offset hasMore }
  }
}
