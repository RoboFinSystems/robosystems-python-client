query ListLedgerAccounts(
  $classification: String
  $isActive: Boolean
  $limit: Int! = 100
  $offset: Int! = 0
  $entityId: String
) {
  accounts(
    classification: $classification
    isActive: $isActive
    limit: $limit
    offset: $offset
    entityId: $entityId
  ) {
    accounts {
      id
      code
      name
      description
      trait
      subClassification
      balanceType
      parentId
      depth
      currency
      isActive
      isPlaceholder
      accountType
      externalId
      externalSource
    }
    pagination { total limit offset hasMore }
  }
}
