query GetLedgerPeriodCloseStatus(
  $periodStart: Date!
  $periodEnd: Date!
  $entityId: String
) {
  periodCloseStatus(periodStart: $periodStart, periodEnd: $periodEnd, entityId: $entityId) {
    fiscalPeriodStart fiscalPeriodEnd periodStatus totalDraft totalPosted
    schedules {
      structureId structureName amount status
      entryId reversalEntryId reversalStatus
    }
  }
}
