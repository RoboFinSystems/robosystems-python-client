query GetLedgerAccountTree($entityId: String) {
  accountTree(entityId: $entityId) {
    totalAccounts
    roots {
      id code name trait accountType balanceType depth isActive
      children {
        id code name trait accountType balanceType depth isActive
        children {
          id code name trait accountType balanceType depth isActive
          children {
            id code name trait accountType balanceType depth isActive
          }
        }
      }
    }
  }
}
