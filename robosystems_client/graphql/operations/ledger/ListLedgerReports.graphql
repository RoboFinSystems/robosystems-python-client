query ListLedgerReports($lifecycle: ReportLifecycle, $entityId: String) {
  reports(lifecycle: $lifecycle, entityId: $entityId) {
    reports {
      id entityId name taxonomyId generationStatus filingStatus periodType
      periodStart periodEnd comparative mappingId aiGenerated
      createdAt lastGenerated entityName
      sourceGraphId sourceReportId sharedAt
      periods { start end label }
      structures { id name blockType }
    }
  }
}
