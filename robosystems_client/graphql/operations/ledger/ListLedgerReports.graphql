query ListLedgerReports($lifecycle: ReportLifecycle! = CURRENT) {
  reports(lifecycle: $lifecycle) {
    reports {
      id name taxonomyId generationStatus filingStatus periodType
      periodStart periodEnd comparative mappingId aiGenerated
      createdAt lastGenerated entityName
      sourceGraphId sourceReportId sharedAt
      periods { start end label }
      structures { id name blockType }
    }
  }
}
