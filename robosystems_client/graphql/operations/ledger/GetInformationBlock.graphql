query GetInformationBlock(
  $id: ID!
  $scenarioId: String
  $series: Boolean! = false
  $seriesHistory: Int
  $seriesForecast: Int
) {
  informationBlock(
    id: $id
    scenarioId: $scenarioId
    series: $series
    seriesHistory: $seriesHistory
    seriesForecast: $seriesForecast
  ) {
    id blockType name displayName category
    taxonomyId taxonomyName
    informationModel { conceptArrangement memberArrangement }
    artifact { topic rendererNote template mechanics }
    elements {
      id qname name code elementType
      isAbstract isMonetary balanceType periodType
    }
    connections {
      id fromElementId toElementId associationType
      arcrole orderValue weight
    }
    facts {
      id elementId value textValue factType contentType periodStart periodEnd
      periodType unit factScope factSetId
    }
    rules {
      id ruleCategory rulePattern ruleCheckKind ruleExpression
      ruleMessage ruleSeverity ruleOrigin
      ruleTarget { targetKind targetRefId }
      ruleVariables { variableName variableQname }
    }
    factSet {
      id structureId periodStart periodEnd
      factsetType entityId reportId scenarioId provenance
    }
    verificationResults {
      id ruleId structureId factSetId status message
      periodStart periodEnd evaluatedAt
    }
    verificationSummary {
      total passed failed errored skipped
      byCategory { category total passed failed errored skipped }
    }
    view {
      rendering {
        rows {
          elementId elementQname elementName classification
          balanceType itemType values textValue isSubtotal depth
        }
        periods { start end label forecast }
        validation { passed checks failures warnings }
        unmappedCount
      }
      chart {
        panels {
          label itemType kind
          series { key elementId label }
        }
      }
    }
  }
}
