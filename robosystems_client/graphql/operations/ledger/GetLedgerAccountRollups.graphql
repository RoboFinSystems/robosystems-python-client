query GetLedgerAccountRollups(
  $mappingId: String
  $startDate: Date
  $endDate: Date
  $entityId: String
) {
  accountRollups(
    mappingId: $mappingId
    startDate: $startDate
    endDate: $endDate
    entityId: $entityId
  ) {
    mappingId
    mappingName
    totalMapped
    totalUnmapped
    groups {
      reportingElementId
      reportingName
      reportingQname
      trait
      balanceType
      total
      accounts {
        elementId
        accountName
        accountCode
        totalDebits
        totalCredits
        netBalance
      }
    }
  }
}
