query ListLibraryTaxonomyArcs(
  $taxonomyId: ID!
  $associationType: String
  $structureId: ID
  $limit: Int! = 200
  $offset: Int! = 0
) {
  libraryTaxonomyArcCount(
    taxonomyId: $taxonomyId
    associationType: $associationType
    structureId: $structureId
  )
  libraryTaxonomyArcs(
    taxonomyId: $taxonomyId
    associationType: $associationType
    structureId: $structureId
    limit: $limit
    offset: $offset
  ) {
    id
    structureId
    structureName
    fromElementId
    fromElementQname
    fromElementName
    fromElementTrait
    fromElementIsAbstract
    toElementId
    toElementQname
    toElementName
    toElementTrait
    toElementIsAbstract
    associationType
    arcrole
    orderValue
    weight
  }
}
